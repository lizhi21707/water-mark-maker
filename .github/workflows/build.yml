name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # Release 创建/上传资产
  actions: read # download-artifact

jobs:
  mac:
    runs-on: macos-latest
    env:
      # CI 走 GitHub 官方源，覆盖 electron-builder.yml 里的 npmmirror（本地中国网络专用）
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:mac
        env:
          # electron-builder 收尾会调 GitHub API 拿仓库信息（更新元数据），CI 上必须有令牌
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  win:
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: win-nsis
          path: dist/*.exe
          if-no-files-found: error

  release:
    # 只跑 tag 构建；统一一个 job 发布，避免 mac/win 并发创建 Release 竞态
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{mac-dmg,win-nsis}'
      - name: 发布 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mac-dmg/*.dmg
            dist/win-nsis/*.exe
