appId: com.watermark.maker
productName: 水印工具
directories:
  buildResources: build
  output: dist

files:
  - out/**
  # 平台/架构裁剪统一由 afterPack 处理（files 里的排除是全局的，会误伤 Windows 构建）

asar: true
# 原生二进制必须解包（sharp / resvg-js 及其平台包）
asarUnpack:
  - node_modules/@img/**
  - node_modules/sharp/**
  - node_modules/@resvg/**
npmRebuild: false
# 打包后删除错架构平台包（见 scripts/afterPack.js）
afterPack: scripts/afterPack.js
# 仅保留中英文 locale，减小体积
electronLanguages:
  - zh_CN
  - en

extraResources:
  - from: resources/fonts
    to: fonts

mac:
  # ad-hoc 签名：无签名 + quarantine 会被 Gatekeeper 每次启动杀掉（弹跳打不开）；
  # 有签名（哪怕 ad-hoc）右键→打开一次后放行记录能绑定 CDHash，永久生效
  identity: "-"
  category: public.app-category.graphics-design
  target:
    - dmg
  icon: build/icon.png

dmg:
  title: 水印工具
  # 文件名用 ASCII：artifact 传输链（upload/download-artifact）会剥掉非 ASCII 字符
  artifactName: water-mark-maker-${version}-${arch}.${ext}

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 水印工具
  createDesktopShortcut: true
  artifactName: water-mark-maker-${version}-setup.${ext}

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
