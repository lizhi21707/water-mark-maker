appId: com.watermark.maker
productName: 水印工具
directories:
  buildResources: build
  output: dist

files:
  - out/**
  # 平台/架构裁剪统一由 afterPack 处理（files 里的排除是全局的，会误伤 Windows 构建）

asar: true
# 原生二进制必须解包（sharp / resvg-js 及其平台包）
asarUnpack:
  - node_modules/@img/**
  - node_modules/sharp/**
  - node_modules/@resvg/**
npmRebuild: false
# 打包后删除错架构平台包（见 scripts/afterPack.js）
afterPack: scripts/afterPack.js
# 仅保留中英文 locale，减小体积
electronLanguages:
  - zh_CN
  - en

extraResources:
  - from: resources/fonts
    to: fonts

mac:
  identity: null # 无签名构建（首次打开需右键→打开）
  category: public.app-category.graphics-design
  target:
    - dmg
  icon: build/icon.png

dmg:
  title: 水印工具

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 水印工具
  createDesktopShortcut: true

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
